ence","It broadens the argument to suggest the problem is global, not local"],"correct":1,"day":"Wednesday"},{"q":"On Wednesday, your independent task involved: \"Topic: discovering something unexpected in an old building.\" — what skill was this developing?","options":["Combining techniques — planning before drafting","Review: subordination vs coordination across a paragraph","Vocabulary of concession","Peer editing for voice and style"],"correct":0,"day":"Wednesday"},{"q":"Which National Curriculum writing focus does Wednesday's lesson on \"Combining techniques — planning before drafting\" connect to?","options":["Planning technique use before drafting","Peer editing for voice and style","Sentence variety: S/Co/Cx review","Vocabulary of concession"],"correct":0,"day":"Wednesday"},{"q":"\"in New Zealand lots of kids dont get enough physical activity at school its really important for their health and wellbeing.\" Thursday's seven-pass checklist — which passes find errors here?","options":["Pass 1 only — capital letters and full stops are missing","Pass 1 (capitals/full stops), Pass 2 (apostrophe in \"dont\"), Pass 3 (comma after fronted adverbial), Pass 5 (informal vocabulary: \"lots of kids,\" \"really important\")","Pass 5 and Pass 7 only — register and cohesion","Pass 2 and Pass 4 only — apostrophes and colons/semicolons"],"correct":1,"day":"Thursday"},{"q":"Thursday's tip: \"Seven passes, seven focuses. One pass, one rule, every time.\" In the model passage, Pass 7 (cohesion) suggests adding a linking adverb between sentences. Which linking adverb best connects \"research shows that active students do better academically\" to the next sentence about what the government should do?","options":["\"However\" — to contrast the research with the government's response","\"Nevertheless\" — to qualify the research finding","\"Consequently\" or \"Therefore\" — to signal that the evidence leads logically to the policy recommendation","\"Furthermore\" — to add another supp e structure","Precise verb choice","Systematic weak-verb editing"],"correct":0,"day":"Tuesday"},{"q":"\"Due to the fact that plastic bags cause a great deal of harm to sea life, it would be a good idea to consider banning them.\" Wednesday's lesson says this needs to be cut. Which version is the best direct, concise rewrite?","options":["\"Plastic bags cause harm to sea life and it would be good to think about banning them.\"","\"Plastic bags harm sea life. Ban them.\"","\"Due to plastic bags causing harm to sea life, banning them is something to consider.\"","\"Plastic bags cause a lot of harm to sea life and therefore should possibly be banned.\""],"correct":1,"day":"Wednesday"},{"q":"Wednesday's tip: \"In persuasive writing, short sentences make your key claim land hard.\" Which version delivers the claim with most impact?","options":["\"We must act now due to the fact that litter is causing significant problems.\"","\"It would be beneficial if we were to act now on the issue of litter.\"","\"Litter harms wildlife. It pollutes waterways. It costs millions to clean up. We must act now.\"","\"Acting now is something we should consider given the problems caused by litter.\""],"correct":2,"day":"Wednesday"},{"q":"On Wednesday, your independent task involved: \"Start with: 'The storm had one final surprise'\" — what skill was this developing?","options":["Using a colon to introduce and expand an idea","Colons — introducing lists and elaboration","Precise verb choice: replacing weak verbs","Editing: upgrading weak verbs throughout a passage"],"correct":0,"day":"Wednesday"},{"q":"Which National Curriculum writing focus does Wednesday's lesson on \"Using a colon to introduce and expand an idea\" connect to?","options":["Two-part colon sentence structure","Colons for lists and elaboration","Systematic weak-verb editing","Precise verb choice"],"correct":0,"day":"Wednesday"},{"q":"\"The monarch butterfly undergoes four stages of metamorphosis. First, the egg was laid on a milkweed leaf.\" What is wrong with the second sentence?","options":["\"was laid\" is passive voice and reports should use active voice","\"was laid\" is past tense — Thursday's lesson says reports use present tense for facts","\"milkweed\" should be capitalised as it is a specific plant name","\"First\" should be followed by a comma and then a full sentence, not a dependent clause"],"correct":1,"day":"Thursday"},{"q":"\"Dolphins eat fish, squid and they also had crustaceans.\" Thursday's lesson fixes this to \"Dolphins eat fish, squid, and crustaceans.\" What TWO errors were corrected?","options":["Tense inconsistency (\"had\" → \"eat\") and non-parallel list structure (\"they also had crustaceans\" → \"crustaceans\")","Missing Oxford comma and incorrect verb form","Passive voice and incorrect pronoun reference","Tense inconsistency and a missing comma after \"squid\""],"correct":0,"day":"Thursday"},{"q":"Thursday's editing task included: \"The girl went into the kitchen and looked in the fridge. She got out some food and did some coo…\" — what were you focused on here?","options":["Editing: upgrading weak verbs throughout a passage","Using a colon to introduce and expand an idea","Precise verb choice: replacing weak verbs","Colons — introducing lists and elaboration"],"correct":0,"day":"Thursday"},{"q":"Which National Curriculum writing focus does Thursday's lesson on \"Editing: upgrading weak verbs throughout a passage\" connect to?","options":["Systematic weak-verb editing","Two-part colon sentence structure","Colons for lists and elaboration","Precise verb choice"],"correct":0,"day":"Thursday"}],"3-10":[{"q":"\"Although the path had disappeared, she kept moving — the sound of the stream, which she could hear but not yet see, was pulling her forward...\" Which punctuation mark creates a trailing-off suspense effect here?","options":["The dash — it creates a dramatic pause before the main action","The ellipsis — it creates a pause that leaves the reader's imagination to fill the gap","The comma after \"disappeared\" — it separates the two clauses","The commas around \"which she could hear but not yet see\" — they set off the relative clause"],"correct":1,"day":"Monday"},{"q":"\"Despite the rain — which had turned the track to mud — Rangi kept his pace.\" What job do the dashes do here?","options":["They replace a colon to introduce an explanation","They create a parenthetical aside — adding detail that could be removed without breaking the sentence","They signal a tense change from past to present","They replace speech marks around Rangi's thought"],"correct":1,"day":"Monday"},{"q":"In Monday's independent task, you worked on: \"A roaring waterfall.\" — which skill from that lesson were you practising?","options":["Term review: choosing the best figurative device","Whole-piece edit: applying the term's checklist","Term review: constructing a flexible paragraph","Term review: mixed grammar"],"correct":0,"day":"Monday"},{"q":"Which National Curriculum writing focus does Monday's lesson on \"Term review: choosing the best figurative device\" connect to?","options":["Figurative language: term review","Mixed grammar review","Deliberate combination of sentence techniques","Whole-piece systematic editing"],"correct":0,"day":"Monday"},{"q":"\"The children's kapa haka group had performed beautifully.\" Which TWO grammar features appear in this sentence?","options":["Present perfect tense and a relative clause","Irregular plural possessive (\"children's\") and past perfect tense (\"had performed\")","Collective noun and a modal verb","Fronted adverbial and subject-verb agreement"],"correct":1,"day":"Tuesday"},{"q":"\"They, exhausted and elated, would remember this night forever.\" Where are the adjectives placed — and what effect does this create?","options":["Before the noun — standard placement for smooth flow","After the linking verb — describing the state of the subject","After the pronoun, set off by commas — dramatic emphasis making the exhaustion and elation feel significant","At the end of the sentence — creating a trailing conclusion"],"correct":2,"day":"Tuesday"},{"q":"Tuesday's \"You Do\" task asked you to work on: \"Identify the features: \"The match was cancelled because of the storm, and everyone went home di…\" — what was this task practising?","options":["Term review: mixed grammar","Term review: choosing the best figurative device","Whole-piece edit: applying the term's checklist","Term review: constructing a flexible paragraph"],"correct":0,"day":"Tuesday"},{"q":"Which National Curriculum writing focus does Tuesday's lesson on \"Term review: mixed grammar\" connect to?","options":["Mixed grammar review","Deliberate combination of sentence techniques","Whole-piece systematic editing","Figurative language: term review"],"correct":0,"day":"Tuesday"},{"q":"\"The ruru called twice, then silence swallowed the forest.\" Which Term 3 sentence technique is \"silence swallowed the forest\"?","options":["Show don't tell — describing a physical symptom of an emotion","Personification — giving silence a human action (swallowing)","Simile — comparing silence to something that swallows","Sensory detail — appealing to the sense of hearing"],"correct":1,"day":"Wednesday"},{"q":"\"She had been waiting for this moment for three years. It was over in seconds.\" What technique is used — and why is it effective?","options":["Show don't tell — the waiting is shown through physical detail","Varied sentence length — the long sentence builds anticipation, the short sentence delivers the impact of how fast it ended","Past perfect — the waiting happened before another past moment","Fronted adverbial — the time phrase comes before the main clause"],"correct":1,"day":"Wednesday"},{"q":"On Wednesday, your independent task involved: \"Topic: discovering something unexpected.\" — what skill was this developing?","options":["Term review: constructing a flexible paragraph","Term review: mixed grammar","Whole-piece edit: applying the term's checklist","Term review: choosing the best figurative device"],"correct":0,"day":"Wednesday"},{"q":"Which National Curriculum writing focus does Wednesday's lesson on \"Term review: constructing a flexible paragraph\" connect to?","options":["Deliberate combination of sentence techniques","Mixed grammar review","Figurative language: term review","Whole-piece systematic editing"],"correct":0,"day":"Wednesday"},{"q":"Thursday's Term 3 checklist: Pass 2 says \"Replace any 'she was [emotion]'.\" Apply it to \"Aroha was nervous as she waited to perform.\" Which revision correctly shows rather than tells?","options":["\"Aroha felt very nervous as she waited to perform on stage.\"","\"Aroha was extremely nervous — she had never felt this nervous before.\"","\"Aroha's hands twisted in her lap; she kept her eyes fixed on the door.\"","\"Aroha, who was nervous, waited to perform for the audience.\""],"correct":2,"day":"Thursday"},{"q":"Thursday's Pass 6: \"At least one figurative language device.\" Apply it to: \"The hall was big and the lights were very bright.\" Which revision adds a figurative device?","options":["\"The hall was enormous and the lights were extremely bright.\"","\"The hall was large, and the lights were very, very bright.\"","\"The hall stretched away like a held breath, and the lights blazed overhead.\"","\"The very big hall had lights that were quite bright above her.\""],"correct":2,"day":"Thursday"},{"q":"Thursday's editing task included: \"✦ Work through each checklist category in turn: figurative language, voice, register, cohesion,…\" — what were you focused on here?","options":["Whole-piece edit: applying the term's checklist","Term review: mixed grammar","Term review: constructing a flexible paragraph","Term review: choosing the best figurative device"],"correct":0,"day":"Thursday"},{"q":"Which National Curriculum writing focus does Thursday's lesson on \"Whole-piece edit: applying the term's checklist\" connect to?","options":["Whole-piece systematic editing","Figurative language: term review","Deliberate combination of sentence techniques","Mixed grammar review"],"correct":0,"day":"Thursday"}],"3-9":[{"q":"\"The wind whispered through the tī kōuka.\" Monday's lesson says: \"The verb you choose carries the mood.\" What mood does \"whispered\" create?","options":["Danger and threat — whispering signals something sinister","Gentleness and secrecy — a hushed, intimate atmosphere","Joy and lightness — the wind is playful and cheerful","Power and violence — whispering shows restrained force"],"correct":1,"day":"Monday"},{"q":"\"The ocean clawed at the base of the cliff.\" Which human quality does \"clawed\" give the ocean — and what mood does it create?","options":["Hunger and aggression — the ocean is attacking, dangerous, relentless","Sadness and longing — the ocean is reaching for something it cannot have","Playfulness and curiosity — the ocean is exploring the cliff face","Exhaustion — the ocean is weakly scraping at the cliff"],"correct":0,"day":"Monday"},{"q":"In Monday's independent task, you worked on: \"A bird landed on a branch above a river.\" — which skill from that lesson were you practising?","options":["Expanding noun phrases for detail","Peer editing for text-type structure","Sequencing sentences in recount and procedure","Passive voice in explanation writing"],"correct":0,"day":"Monday"},{"q":"Which National Curriculum writing focus does Monday's lesson on \"Expanding noun phrases for detail\" connect to?","options":["Selective noun phrase expansion","Peer editing for structure","Passive voice in explanation text type","Time connectives in recount and procedure"],"correct":0,"day":"Monday"},{"q":"\"Kiwi numbers have increased ___ intensive predator control was introduced.\" Is this a narrative or informational use — and which conjunction fits?","options":["Narrative — \"until\" creates tension about when the increase will stop","Informational — \"because\" shows a cause-and-effect relationship","Narrative — \"but\" creates contrast between the numbers and the control","Informational — \"although\" qualifies the increase with a condition"],"correct":1,"day":"Tuesday"},{"q":"\"She kept paddling ___ she could no longer feel her arms.\" Is this narrative or informational — and which conjunction fits?","options":["Informational — \"because\" explains why she stopped paddling","Narrative — \"although\" creates contrast but feels less urgent","Narrative — \"until\" shows her pushing to an extreme limit, creating tension","Informational — \"before\" sets up the sequence of events"],"correct":2,"day":"Tuesday"},{"q":"Tuesday's \"You Do\" task asked you to work on: \"Explanation: People filter the water before it reaches our taps.\" — what was this task practising?","options":["Passive voice in explanation writing","Peer editing for text-type structure","Sequencing sentences in recount and procedure","Expanding noun phrases for detail"],"correct":0,"day":"Tuesday"},{"q":"Which National Curriculum writing focus does Tuesday's lesson on \"Passive voice in explanation writing\" connect to?","options":["Passive voice in explanation text type","Selective noun phrase expansion","Time connectives in recount and procedure","Peer editing for structure"],"correct":0,"day":"Tuesday"},{"q":"\"At first, the waka moved slowly through the shallows. As the water deepened, the crew found their rhythm. By the time they cleared the harbour mouth, they were moving as one.\" What do the three underlined phrases do?","options":["They are fronted adverbials of place — they show where the waka was at each point","They are time connectives — they move the paragraph forward in sequence and anchor each moment in time","They are subordinate clauses — each one depends on the main clause for meaning","They are relative clauses — each one adds extra information about the waka"],"correct":1,"day":"Wednesday"},{"q":"Wednesday's tip says to vary time connectives — \"don' lear position, PEEL structure, persuasive connectives, formal regist…\" — what were you focused on here?","options":["Peer editing for text-type structure","Sequencing sentences in recount and procedure","Passive voice in explanation writing","Expanding noun phrases for detail"],"correct":0,"day":"Thursday"},{"q":"Which National Curriculum writing focus does Thursday's lesson on \"Peer editing for text-type structure\" connect to?","options":["Peer editing for structure","Passive voice in explanation text type","Time connectives in recount and procedure","Selective noun phrase expansion"],"correct":0,"day":"Thursday"}],"3-8":[{"q":"\"celebrate\" + \"-tion\" = \"celebration.\" Monday's tip says to drop the silent e before a vowel suffix. Which word correctly applies this rule?","options":["\"managment\" — from \"manage\" + \"-ment\"","\"laziness\" — from \"lazy\" + \"-ness\"","\"celebrattion\" — from \"celebrate\" + \"-tion\"","\"creation\" — from \"create\" + \"-tion\" (e dropped before vowel suffix)"],"correct":3,"day":"Monday"},{"q":"\"happy\" + \"-ness\" = \"happiness.\" Monday's tip says change y to i before a suffix. Which word correctly applies this rule?","options":["\"laziness\" — from \"lazy\" (y → i) + \"-ness\"","\"lazness\" — from \"lazy\" + \"-ness\" with y dropped","\"lazyness\" — from \"lazy\" + \"-ness\" with no change","\"lazieness\" — from \"lazy\" (y → ie) + \"-ness\""],"correct":0,"day":"Monday"},{"q":"In Monday's independent task, you worked on: \"Use the idiom 'once in a blue moon' in a sentence.\" — which skill from that lesson were you practising?","options":["Idioms and figurative expressions","Self-editing with a full checklist","Parenthesis review: commas, brackets, dashes","Embedding clauses for sophistication"],"correct":0,"day":"Monday"},{"q":"Which National Curriculum writing focus does Monday's lesson on \"Idioms and figurative expressions\" connect to?","options":["Idioms and figurative expressions","Comprehensive self-editing checklist","Embedding multiple clause types","Parenthesis: commas, brackets, and dashes compared"],"correct":0,"day":"Monday"},{"q":"\"Beneath the canopy of ancient rimu, the forest floor was deep in shadow.\" Tuesday's lesson says prepositional phrases in setting do two jobs. What are they?","options":["They name the setting and introduce the characters","They locate us precisely AND contribute to atmosphere","They tell us the time and the weather conditions","They replace adverbs and add length to descriptions"],"correct":1,"day":"Tuesday"},{"q":"\"Between the roots of the largest tree, something moved.\" Tuesday's tip: \"Choose prepositions that carry the mood you want.\" What mood does \"between\" create here?","options":["Openness and freedom — between suggests space and possibility","Height and perspective — between implies a view from above","Unease and enclosure — something hiding in a tight, dark space","Distance and isolation — between suggests the thing is far away"],"correct":2,"day":"Tuesday"},{"q":"Tuesday's \"You Do\" task asked you to work on: \"The Treaty of Waitangi signed in 1840 is central to New Zealand's history.\" — what was this task practising?","options":["Parenthesis review: commas, brackets, dashes","Self-editing with a full checklist","Embedding clauses for sophistication","Idioms and figurative expressions"],"correct":0,"day":"Tuesday"},{"q":"Which National Curriculum writing focus does Tuesday's lesson on \"Parenthesis review: commas, brackets, dashes\" connect to?","options":["Parenthesis: commas, brackets, and dashes compared","Idioms and figurative expressions","Comprehensive self-editing checklist","Embedding multiple clause types"],"correct":0,"day":"Tuesday"},{"q":"\"High above the valley, the kārearea surveyed its territory.\" Wednesday's lesson says \"High above the valley\" is a fronted adverbial of place. What atmosphere does it create before the main clause begins?","options":["Danger — the height suggests the kārearea is about to ns a dash which signals figurative language"],"correct":1,"day":"Monday"},{"q":"\"Her voice was like a tui calling across a still morning.\" Is this a simile or a metaphor — and what is the effect?","options":["Metaphor — her voice IS a tui, creating an immediate and powerful image","Simile — \"like a tui\" signals comparison, creating a considered, musical image with some distance","Personification — the tui is given a human voice","Simile — \"still morning\" shows the comparison is gentle and quiet"],"correct":1,"day":"Monday"},{"q":"In Monday's independent task, you worked on: \"Informal → Formal: 'Can you tell the boss I'm gonna be late?'\" — which skill from that lesson were you practising?","options":["Formal vs informal register","Balancing sentence rhythm","Reported (indirect) speech","Editing for cohesion"],"correct":0,"day":"Monday"},{"q":"Which National Curriculum writing focus does Monday's lesson on \"Formal vs informal register\" connect to?","options":["Register: formal and informal language","Balancing sentence rhythm across a paragraph","Cohesion across paragraphs","Direct and reported (indirect) speech"],"correct":0,"day":"Monday"},{"q":"\"The kākāpō is extremely rare.\" Tuesday's lesson says this degree adverb earns its place. Why?","options":["Because \"extremely\" is a longer word than \"very\" and therefore more precise","Because \"extremely\" emphasises a fact that genuinely matters — the kākāpō's rarity is a serious conservation concern","Because \"extremely\" always earns its place before any adjective","Because \"rare\" is a weak adjective that needs \"extremely\" to do the work"],"correct":1,"day":"Tuesday"},{"q":"\"She was very sad about what had happened.\" Tuesday's tip: \"Is there one word that says this better?\" Which single word best replaces \"very sad\"?","options":["upset","unhappy","devastated","quite sad"],"correct":2,"day":"Tuesday"},{"q":"Tuesday's \"You Do\" task asked you to work on: \"Convert to reported speech: Aroha said
